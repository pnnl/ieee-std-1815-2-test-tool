[package]
name = "test_tool_macros"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[lib]
path = "lib.rs"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
utoipa = { workspace = true }

[features]
utoipa = []

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27.2", features = ["derive"] }
