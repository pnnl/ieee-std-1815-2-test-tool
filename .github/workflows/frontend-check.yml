name: Frontend Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Lint, and Type Check
    runs-on: ubuntu-latest

    # vite.config.ts reads these to dial the backend for generating
    # the OpenAPI-TS client.
    env:
      BACKEND_HOST: localhost
      BACKEND_PORT: 8025

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run type-check
