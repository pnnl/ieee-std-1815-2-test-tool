---
default_install_hook_types: [pre-commit, pre-push]

repos:
  # Rust formatting and linting
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code
        entry: cargo fmt
        language: system
        files: \.rs$
        args: [--all, --]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code
        entry: cargo clippy
        language: system
        files: \.rs$
        args: [--all-targets, --all-features, --, -D, warnings]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: Check Rust code
        entry: cargo check
        language: system
        files: \.rs$
        args: [--all]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        description: Run Rust tests
        entry: cargo test
        language: system
        files: \.rs$
        stages: [pre-push]
        pass_filenames: false

  # Frontend formatting and linting
  - repo: local
    hooks:
      - id: frontend-prettier
        name: prettier (frontend)
        description: Format only the staged frontend TS/JS files
        entry: bash -c 'files=(); for f in "$@"; do files+=("${f#frontend/}"); done; cd frontend && node_modules/.bin/prettier --write "${files[@]}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$

      - id: frontend-eslint
        name: eslint (frontend)
        description: Lint only the staged frontend TS/JS files
        entry: bash -c 'files=(); for f in "$@"; do files+=("${f#frontend/}"); done; cd frontend && node_modules/.bin/eslint --fix --max-warnings 0 --no-warn-ignored "${files[@]}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$

      - id: frontend-test
        name: vitest (frontend)
        description: Run frontend unit/component tests
        entry: npm --prefix frontend run test:run
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        stages: [pre-push]
        pass_filenames: false
